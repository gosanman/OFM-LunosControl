;
; OFM-KwlControl — nur fuer die nativen Tests.
;
; Dieses Repository ist eine Bibliothek und wird im Geraeteprojekt als lib/
; eingebunden; gebaut wird die Firmware dort. Hier steht nur die Umgebung, mit
; der sich die hardwareunabhaengige Logik ohne Geraet pruefen laesst:
;
;   pio test -e native
;
; Geprueft wird die Schicht, in der ein Fehler einen Luefter auf Vollgas stellt -
; Kennlinie, Volt-nach-Code, Klemmung, Leitungskompensation. Sie ist bewusst frei
; von Arduino, KNX und Board-Headern.
;
[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
; Nur die hardwareunabhaengigen Quellen. Alles Weitere (Module, Treiber) braucht
; Arduino und gehoert nicht in diese Umgebung.
build_src_filter =
  +<KwlCurve.cpp>
  +<CableComp.cpp>
  +<StageLadder.cpp>
  +<MoistAir.cpp>
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
